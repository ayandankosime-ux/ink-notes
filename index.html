<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ink.</title>
  <link rel="stylesheet" href="styles/general.css">
  <link rel="stylesheet" href="styles/sidebar.css">
  <link rel="stylesheet" href="styles/main-container.css">
</head>
<body>
  <div class="sidebar">
  <div class="search-container">
    <input class="search-input js-search-input" type="text" placeholder="Search notes">
      <img src="icons/search.png" class="search-icon" alt="search">
  </div>

  <!-- Moved outside search-container -->
  <button class="btn-new-note js-btn-new-note">
    + NEW NOTE
  </button>
    
  <div class="tag-container">
    <h4>TAGS</h4>
    <div class="tag-box">
      <button class="tag tag-work js-work-tag">#work</button>
      <button class="tag tag-personal js-personal-tag">#personal</button>
      <button class="tag tag-ideas js-ideas-tag">#ideas</button>
      <button class="tag tag-all js-all-tag">#all</button>
    </div>
  </div>

  <h4>NOTES</h4>
  <div class="notes-container">
    <div class="note-box js-note-box"></div>
  </div>
</div>

  <div class="main-container">
    <header>
      <h2>Ink.</h2>
      <div class="header-buttons">
        <button class="btn-pin js-btn-pin">Pin  📌</button>
        <button class="btn-delete js-btn-delete">Delete</button>
        <button class="btn-save js-btn-save">Save</button>
        <select class="btn-tag js-btn-tag" name="tag">
          <option value="personal">personal</option>
          <option value="work">work</option>
          <option value="ideas">ideas</option>
        </select>
      </div>
    </header>
    <main>
      <div class="note-heading">
        <input class="title-input js-title-input" type="text" placeholder="Title">
      </div>
      <textarea class="textbox js-textbox" placeholder="Write your notes here..."></textarea>
    </main>
    <footer>
      <p class="note-info-text js-note-info-text">Created ----/--/--, --- characters - Last edited --:--</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
